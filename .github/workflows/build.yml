name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Official Buildozer Action
      uses: snok/install-poetry@v1 # Ortam hazırlığı için tetikleyici
      if: false

    - name: Compile APK via Dockerized Buildozer
      uses: ejOffset/buildozer-action@main
      with:
        command: buildozer -v android debug
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
