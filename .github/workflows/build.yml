name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev git
        pip install --upgrade pip
        pip install buildozer cython==0.29.34

    - name: Install Android SDK Build-Tools manually
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
        
        # Command-line tools indir
        cd /tmp
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        mkdir -p temp_cmdline/cmdline-tools
        unzip -q cmdtools.zip -d temp_cmdline/cmdline-tools
        mv temp_cmdline/cmdline-tools/cmdline-tools temp_cmdline/cmdline-tools/latest
        mkdir -p $ANDROID_HOME/cmdline-tools
        mv temp_cmdline/cmdline-tools/latest $ANDROID_HOME/cmdline-tools/
        
        # SDK bileşenlerini kabul edip yükle (build-tools, platform-tools, android-33 vb.)
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Build with Buildozer
      run: buildozer -v android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
