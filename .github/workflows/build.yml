name: Build NeonDash APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bagimliliklari Kur
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev libltdl-dev
          pip3 install --upgrade pip
          pip3 install buildozer==1.5.0 cython==0.29.36

      - name: Lisanslari Kabul Et
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.1.8937393"

      - name: APK Olustur
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          buildozer android debug

      - name: APK yi Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: NeonDash-APK
          path: bin/*.apk
