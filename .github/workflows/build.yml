name: Build NeonDash APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
      sudo dpkg --add-architecture i386
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        git zip unzip patch ccache cmake \
        autoconf automake libtool libltdl-dev \
        pkg-config zlib1g-dev libssl-dev libffi-dev \
        libncurses-dev gettext build-essential \
        openjdk-17-jdk libstdc++6:i386 libgcc1:i386 zlib1g:i386 libncurses6:i386 libtinfo6:i386

      - name: Cache buildozer global dir (SDK / NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer "cython<3.0" setuptools
          buildozer version

      - name: Build APK
        run: buildozer android debug

      - name: List output
        if: always()
        run: ls -lh bin/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDash-APK
          path: bin/*.apk
          if-no-files-found: error
