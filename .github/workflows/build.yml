- name: Setup Android SDK Tools correctly for Buildozer
      run: |
        export ANDROID_HOME=/home/runner/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        # Command-line tools indir ve Buildozer'ın bulabileceği konuma taşı
        cd /tmp
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip -d temp_cmdline
        
        # Buildozer'ın aradığı tools/bin/sdkmanager yapısını sağlamak için dizinleri ayarlayalım
        mkdir -p $ANDROID_HOME/tools/bin
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        
        cp -r temp_cmdline/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        cp -r temp_cmdline/cmdline-tools/bin/* $ANDROID_HOME/tools/bin/
        
        # Lisansları kabul et ve gerekli araçları kur
        export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
