name: Build NeonDash APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bagimliliklari Kur
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip libffi-dev libssl-dev libbz2-dev
          pip3 install buildozer==1.5.0 cython==0.29.36

      - name: Buildozer SDK yi indir
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          buildozer android debug || true

      - name: Lisanslari Kabul Et ve 37 hatasini fakele
        run: |
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -n 1)
          echo "SDKMANAGER bulundu: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-33" "build-tools;33.0.2" "platform-tools"

          BUILDTOOLS_DIR=$(dirname $(dirname $SDKMANAGER))/../build-tools
          echo "Build-tools dizini: $BUILDTOOLS_DIR"
          ls -la ~/.buildozer/android/platform/android-sdk/build-tools/

          # Iste kilit nokta: 37.0.0 klasoru yok diye aidl bulunamiyor diyor
          # 33.0.2'yi 37.0.0 olarak kopyaliyoruz
          if [ -d ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2 ]; then
            cp -r ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2 ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0
            echo "37.0.0 fake klasoru olusturuldu"
          fi

      - name: Gercek Build
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        run: |
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          buildozer android debug

      - name: APK yi Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: NeonDash-APK
          path: bin/*.apk
